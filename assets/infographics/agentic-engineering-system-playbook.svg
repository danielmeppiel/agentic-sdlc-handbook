<line x1="82" y1="1166" x2="998" y2="1166" stroke="#5C6B1A" stroke-width="1" opacity="0.4"/>
<text x="82" y="1198" font-family="Playfair Display" font-size="20" font-weight="800" fill="#5C6B1A">1  PACKAGE</text>
<text x="82" y="1230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">Agent Package Manager</text>
<text x="82" y="1252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">bundles the workflow</text>
<text x="311" y="1198" font-family="Playfair Display" font-size="20" font-weight="800" fill="#5C6B1A">2  GOVERN</text>
<text x="311" y="1230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">apm-policy.yaml gates</text>
<text x="311" y="1252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">who runs it, which models.</text>
<text x="540" y="1198" font-family="Playfair Display" font-size="20" font-weight="800" fill="#5C6B1A">3  DISTRIBUTE</text>
<text x="540" y="1230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">A signed registry</text>
<text x="540" y="1252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">hands it out, traceable.</text>
<text x="769" y="1198" font-family="Playfair Display" font-size="20" font-weight="800" fill="#5C6B1A">4  CONSUME</text>
<text x="769" y="1230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">Pull by manifest+lockfile;</text>
<text x="769" y="1252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">policy re-checked on run.</text>
<text x="56" y="1292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5C6B1A">A Center of Enablement funds the pools and maintains the lifecycle. Everyone else consumes proven workflows.</text>
